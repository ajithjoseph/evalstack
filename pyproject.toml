[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalstack"
version = "0.0.1"
description = "Open source eval and observability framework for production multi-agent AI systems."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Ajith Joseph", email = "a4ajith@gmail.com"}
]
keywords = ["llm", "eval", "agents", "observability", "ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=2.3.0"]
openai = ["openai>=1.0.0"]
all = ["anthropic>=2.3.0", "openai>=1.0.0"]
dev = [
    "pytest>=7.0.0",
    "ruff==0.17.3",
]

[tool.setuptools]
packages = ["evalstack"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://evalstack.dev"
Repository = "https://github.com/ajithjoseph/evalstack"
